volumes: 
  bw-postgresql:
  migration:
services:
  db:
    image: postgres:16-alpine
    ports: ["55432:5432"]
    volumes: [
      "bw-postgresql:/var/lib/postgresql/data",
    ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      retries: 10
      interval: 3s
      timeout: 5s
      start_period: 10s

  # Container Name or ID (if name not found) 
  # docker exec -i db \
  #  psql -U postgres 
  #  -d BooksWorldDB < .\BooksWorld.BackEnd\src\BooksWorld.Persistence\migration.sql

  checkout-webhook-listener:
    image: stripe/stripe-cli
    command: 
      - listen 
      - --api-key 
      - ${StripeOptions__SecretKey} 
      - --forward-to 
      - ${StripeOptions__CheckoutWebhookUrl}
      - --events 
      - checkout.session.completed,checkout.session.async_payment_succeeded

  backend:
    build: 
      context: ./BooksWorld.BackEnd
    ports: ["8080:8080"]    
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_Environment: Development # Production
    # in real deploy we must to set env variables manually and don't include env files
    env_file: 
      - ./BooksWorld.BackEnd/.env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:  
      context: ./BooksWorld.FrontEnd
    ports: ["3000:80"] 
    environment:
      NODE_ENV: production
    # in real deploy we must to set env variables manually and don't include env files
    env_file:
      - ./BooksWorld.FrontEnd/.env
    depends_on:
      - backend
