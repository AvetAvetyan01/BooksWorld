volumes: 
  bw-postgresql:
services:
  db:
    image: postgres:16-alpine
    ports: ["55432:5432"]
    volumes: ["bw-postgresql:/var/lib/postgresql/data"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      retries: 10
      interval: 3s
      timeout: 5s
      start_period: 10s

  migration:
    build: 
      context: .
      dockerfile: ./docker/migration/Dockerfile
    profiles:
      - db_migration
    env_file:
      - ./BooksWorld.BackEnd/.env
    depends_on:
      db:
        condition: service_healthy

  checkout-webhook-listener:
    image: stripe/stripe-cli
    command: 
      - listen 
      - --api-key 
      - ${StripeOptions__SecretKey} 
      - --forward-to 
      - http://backend:8080/api/checkout/webhook
      - --events 
      - checkout.session.completed,checkout.session.async_payment_succeeded
    profiles:
      - stripe_listener

  backend:
    build: 
      context: ./BooksWorld.BackEnd
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_Environment: Production    
    env_file:
      - ./BooksWorld.BackEnd/.env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:  
      context: ./BooksWorld.FrontEnd
    ports: ["3000:80"] 
    environment:
      NODE_ENV: production
    env_file:
      - ./BooksWorld.FrontEnd/.env
    depends_on:
      - backend
    